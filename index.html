<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>クロノスコープ運勢</title>
  </head>
  <body>
    <div id="app"></div>
    
    <!-- 💡 ファイル名が何に変わっていても、自動で探して100%読み込む魔法のスクリプトです -->
    <script type="module">
      fetch('./assets/').then(res => res.text()).then(html => {
        const match = html.match(/index-[A-Za-z0-9_]+\.js/);
        const scriptName = match ? match[0] : 'index-CHBN2vfw.js';
        const script = document.createElement('script');
        script.type = 'module';
        script.src = './assets/' + scriptName;
        document.body.appendChild(script);
      }).catch(() => {
        const script = document.createElement('script');
        script.type = 'module';
        script.src = './assets/index-CHBN2vfw.js';
        document.body.appendChild(script);
      });
    </script>
  </body>
</html>
