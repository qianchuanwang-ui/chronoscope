<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Cosmic Candy Horoscope ✨</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', 'Kiwi Maru', sans-serif;
            background: linear-gradient(135deg, #FFE5EC 0%, #F0E6FF 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 182, 193, 0.4);
            box-shadow: 0 8px 32px 0 rgba(255, 182, 193, 0.2);
        }
        .btn-gradient {
            background: linear-gradient(90deg, #FF94B7 0%, #B2A4FF 100%);
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 148, 183, 0.4);
        }
    </style>
</head>
<body class="py-10 px-4 text-slate-700">

    <div class="max-w-md mx-auto">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-[#FF6B97] drop-shadow-sm mb-2">🍭 Cosmic Candy</h1>
            <p class="text-sm text-[#8B7ED6] font-medium">あなたと星がぴったり重なる特別な日を見つけよう♪</p>
        </div>

        <div class="glass-card rounded-3xl p-6 mb-8">
            <h2 class="text-lg font-bold text-[#FF7EA5] mb-4 flex items-center gap-2">
                <span>🧸</span> あなたの生まれたとき
            </h2>
            
            <div class="space-y-4">
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">年</label>
                        <input type="number" id="year" value="2000" class="w-full bg-white/80 border border-pink-200 rounded-xl px-3 py-2 text-center text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">月</label>
                        <input type="number" id="month" value="1" class="w-full bg-white/80 border border-pink-200 rounded-xl px-3 py-2 text-center text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">日</label>
                        <input type="number" id="day" value="1" class="w-full bg-white/80 border border-pink-200 rounded-xl px-3 py-2 text-center text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">時間 (時)</label>
                        <input type="number" id="hour" value="12" class="w-full bg-white/80 border border-pink-200 rounded-xl px-3 py-2 text-center text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">時間 (分)</label>
                        <input type="number" id="minute" value="0" class="w-full bg-white/80 border border-pink-200 rounded-xl px-3 py-2 text-center text-sm">
                    </div>
                </div>

                <button onclick="fetchFortune()" class="btn-gradient w-full text-white font-bold py-3 rounded-2xl shadow-md mt-2 cursor-pointer">
                    🔮 星のタイミングを占う
                </button>
            </div>
        </div>

        <div id="loading" class="hidden text-center py-10">
            <span class="inline-block animate-bounce text-3xl">🎀</span>
            <p class="text-sm text-pink-400 mt-2 font-medium">お空の星たちに聞いてるよ、ちょっと待ってね...</p>
        </div>

        <div id="result-area" class="hidden space-y-6">
            <div class="glass-card rounded-3xl p-5 border-2 border-dashed border-pink-300 text-center bg-white/90">
                <span class="text-xl">✨💄 本日のラッキーおみくじ 💄✨</span>
                <div class="mt-3 space-y-1">
                    <p class="text-sm text-slate-500 font-medium">今日のあなたをもっと輝かせるお守りコスメ：</p>
                    <p id="lucky-cosme-text" class="text-md font-bold text-[#FF6B97] py-1 px-2 bg-pink-50 rounded-xl inline-block"></p>
                    <p class="text-xs text-slate-400 font-medium">ラッキーカラー: <span id="lucky-color-text" class="font-bold text-purple-500"></span></p>
                </div>
            </div>

            <div class="glass-card rounded-3xl p-4 text-center">
                <h3 class="text-sm font-bold text-[#8B7ED6] mb-3">💫 あなたの星結びタイムライン</h3>
                <img id="chart-image" src="" alt="Timeline Chart" class="w-full h-auto rounded-2xl shadow-sm border border-white">
            </div>

            <div class="glass-card rounded-2xl p-4 text-center space-y-2 bg-gradient-to-r from-pink-50 to-purple-50">
                <p class="text-xs font-bold text-slate-500">#CosmicCandy で今日の星結びをシェアしよう🎀</p>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="shareToX()" class="bg-[#1DA1F2] text-white text-xs font-bold py-2 px-4 rounded-xl shadow-sm hover:opacity-90 cursor-pointer flex items-center justify-center gap-1">
                        <span>𝕏</span> Xにポストする
                    </button>
                    <button onclick="copyToClipboard()" class="bg-purple-400 text-white text-xs font-bold py-2 px-4 rounded-xl shadow-sm hover:opacity-90 cursor-pointer flex items-center justify-center gap-1">
                        <span>📋</span> テキストをコピー
                    </button>
                </div>
            </div>

            <div id="forecast-list" class="space-y-4"></div>
        </div>
    </div>

    <script>
        let latestFortuneText = "";

        async function fetchFortune() {
            const loading = document.getElementById('loading');
            const resultArea = document.getElementById('result-area');
            const forecastList = document.getElementById('forecast-list');
            
            loading.classList.remove('hidden');
            resultArea.classList.add('hidden');
            forecastList.innerHTML = '';

            const inputData = {
                year: parseInt(document.getElementById('year').value),
                month: parseInt(document.getElementById('month').value),
                day: parseInt(document.getElementById('day').value),
                hour: parseInt(document.getElementById('hour').value),
                minute: parseInt(document.getElementById('minute').value)
            };

            try {
                // ⚠️【Render公開後にここを書き換えます】
                const response = await fetch('http://127.0.0', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(inputData)
                });
                
                const data = await response.json();

                document.getElementById('lucky-cosme-text').innerText = data.lucky_cosme;
                document.getElementById('lucky-color-text').innerText = data.lucky_color;
                document.getElementById('chart-image').src = data.timeline_image;

                if (data.forecast && data.forecast.length > 0) {
                    const top = data.forecast;
                    latestFortuneText = `🍭 Cosmic Candy 🍭\n私の次の特別な星結びの日は【${top.date}】✨\n${top.title} がぴったり重なるよ！\n\n💄今日のラッキーコスメ：${data.lucky_cosme}`;
                } else {
                    latestFortuneText = `🍭 Cosmic Candy 🍭\nこれからのんびり穏やかなハッピー期がやってくるよ✨\n\n💄今日のラッキーコスメ：${data.lucky_cosme}`;
                }

                data.forecast.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'glass-card rounded-2xl p-5 border-l-4 border-l-[#FF94B7]';
                    card.innerHTML = `
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold text-white bg-[#FF94B7] px-3 py-1 rounded-full shadow-sm">${item.date}</span>
                            <span class="text-sm font-bold text-[#8B7ED6]">${item.title}</span>
                        </div>
                        <p class="text-sm leading-relaxed text-slate-600 font-medium">${item.text}</p>
                    `;
                    forecastList.appendChild(card);
                });

                loading.classList.add('hidden');
                resultArea.classList.remove('hidden');

            </div> catch (error) {
                alert('星たちとの通信に失敗しちゃったみたい。少し時間を置いてみてね。');
                loading.classList.add('hidden');
            }
        }

        fnction shareToX() {
            const hashtags = "CosmicCandy,星占い";
            const shareUrl = `https://twitter.com{encodeURIComponent(latestFortuneText)}&hashtags=${encodeURIComponent(hashtags)}`;
            window.open(shareUrl, '_blank');
        }

        function copyToClipboard() {
            const fullText = `${latestFortuneText}\n#CosmicCandy #星占い`;
            navigator.clipboard.writeText(fullText).then(() => {
                alert('占い結果をクリップボードにコピーしたよ！インスタのストーリーや投稿に貼り付けてね🎀');
            }).catch(err => {
                alert('コピーに失敗しちゃった、文字を直接選択してね。');
            });
        }
    </script>
</body>
</html>
